version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gamestore-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql-3292c2b0-davidbaolienminh-b4ca.l.aivencloud.com
      - DB_PORT=16798
      - DB_USER=avnadmin
      - DB_PASSWORD=${AIVEN_DB_PASSWORD}
      - DB_NAME=defaultdb
      - JWT_SECRET=super_secret_gamestore_key_2026
    networks:
      - gamestore-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gamestore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gamestore-net

networks:
  gamestore-net:
    driver: bridge